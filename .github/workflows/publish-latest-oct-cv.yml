name: Publish latest October 2026 CV
on:
  push:
    paths:
      - '.github/workflows/publish-latest-oct-cv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare PDF tools
        run: |
          python -m pip install 'PyMuPDF>=1.24,<2'
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
      - name: Apply latest uploaded CV pages exactly
        run: python scripts/apply_new_oct_cv.py
      - name: Commit updated website CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeLuca-CV-Oct-2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest October CV with updated page layout"
            git push
          fi
