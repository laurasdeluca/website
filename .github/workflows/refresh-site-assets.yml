name: Publish cleaned syllabi and balanced portrait
on:
  push:
    paths:
      - 'scripts/refresh_site_assets.py'
      - '.github/workflows/refresh-site-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and image libraries
        run: python -m pip install 'PyMuPDF>=1.24,<2' 'Pillow>=10,<12'
      - name: Prepare corrected files
        run: python scripts/refresh_site_assets.py
      - name: Validate PDF outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          root=Path('Laura-DeLuca-Six-Proofread-Syllabi')
          files=sorted(root.glob('deluca-syllabus-*.pdf'))
          assert len(files)==6,files
          banned=('Schedule transcribed from','reconstructed for the teaching portfolio','portfolio edition','artist and provenance unrecorded','Reading sequence adapted')
          for file in files:
              doc=fitz.open(file)
              assert len(doc)>2,file
              for page in doc:
                  text=page.get_text()
                  assert text.strip(),(file,'blank page')
                  assert not any(term in text for term in banned),(file,'editorial note')
          egypt=fitz.open(root/'deluca-syllabus-S24.pdf')[0].get_text()
          assert 'Pastimes in Ancient Egypt 3,000 Years Ago' in egypt
          assert 'Harris Museum and Art Gallery, Preston' in egypt
          print('Six verified PDFs: clean editorial copy; Egyptian painting credited.')
          PY
      - name: Commit finished website assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Laura-DeLuca-Six-Proofread-Syllabi/deluca-syllabus-'*.pdf headshot-balanced.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publish six cleaned and renamed syllabus PDFs and balanced headshot"
            git push
          fi
