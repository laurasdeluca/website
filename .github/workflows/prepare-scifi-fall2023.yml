name: Prepare Fall 2023 science-fiction syllabus
on:
  push:
    paths:
      - 'scripts/prepare_scifi_fall2023.py'
      - '.github/workflows/prepare-scifi-fall2023.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-syllabus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF editing library
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Correct Fall 2023 date and class meetings
        run: python scripts/prepare_scifi_fall2023.py
      - name: Commit corrected syllabus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Laura-DeLuca-Six-Proofread-Syllabi/ScienceFiction-Fall2023-Syllabus.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Add Fall 2023 science-fiction syllabus with corrected class dates"
            git push
          fi
